[project]
name = "course-assistant"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "httpx>=0.27",
    "boto3>=1.35",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "numpy>=2.0",
]

[project.optional-dependencies]
media = [
    "faster-whisper>=1.1",
    "av==16.1.0",
    "opencv-python-headless>=4.10",
    "rapidocr-onnxruntime>=1.4",
    "python-pptx>=1.0",
    "pillow>=11.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["llm: calls the live LLM endpoint, excluded by default"]
addopts = "-m 'not llm'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
