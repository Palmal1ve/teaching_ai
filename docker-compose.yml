name: course-assistant

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://course:${POSTGRES_PASSWORD}@postgres:5432/course
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  EMBEDDER_URL: http://embedder:8000
  LLM_BASE_URL: ${LLM_BASE_URL}
  LLM_MODEL: ${LLM_MODEL:-GLM-5.2}
  LLM_API_KEY: ${LLM_API_KEY:-}

x-api-image: &api-image
  build:
    context: ./backend
    target: api
    args:
      UV_DEFAULT_INDEX: ${PYPI_MIRROR:-https://pypi.org/simple}
  image: course-assistant/api

x-media-image: &media-image
  build:
    context: ./backend
    target: media
    args:
      UV_DEFAULT_INDEX: ${PYPI_MIRROR:-https://pypi.org/simple}
      APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
  image: course-assistant/media

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: course
      POSTGRES_DB: course
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U course
      interval: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis:/data
    healthcheck:
      test: redis-cli ping
      interval: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio:/data
    healthcheck:
      test: mc ready local
      interval: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *api-image
    command: sh -c "alembic upgrade head && python -m app.cli init"
    environment:
      <<: *backend-env
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }

  # Downloads bge-m3 once. Nothing is fetched again while the volume exists.
  models:
    <<: *api-image
    user: root
    command: python -m app.cli fetch-models
    environment:
      MODEL_HOST: ${MODEL_HOST:-https://huggingface.co}
      MODEL_REVISION: ${MODEL_REVISION:-main}
    volumes:
      - embedder_models:/models/embedder

  embedder:
    build:
      context: ./embedder
      args:
        PIP_INDEX_URL: ${PYPI_MIRROR:-https://pypi.org/simple}
    image: course-assistant/embedder
    volumes:
      - embedder_models:/models:ro
    depends_on:
      models: { condition: service_completed_successfully }
    healthcheck:
      test: python -c "import urllib.request as u; u.urlopen('http://localhost:8000/health')"
      interval: 10s
      start_period: 180s
      retries: 6
    restart: unless-stopped

  api:
    <<: *api-image
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *backend-env
      LLM_TIMEOUT_S: "60"
      DEMO_LOGIN: ${DEMO_LOGIN:-0}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: python -c "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health')"
      interval: 5s
      retries: 20
    restart: unless-stopped

  worker-media:
    <<: *media-image
    command: celery -A app.pipeline.celery_app worker -Q media -c 1 -n media@%h --loglevel=info
    environment:
      <<: *backend-env
      WHISPER_MODEL: /models/whisper/snapshots/${WHISPER_SNAPSHOT}
    volumes:
      # The whole cache folder, because snapshot files are symlinks into its blobs folder.
      - ${WHISPER_CACHE_DIR}:/models/whisper:ro
      - convert:/convert
      - work:/work
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker-ai:
    <<: *api-image
    command: >
      celery -A app.pipeline.celery_app worker -Q ai -c 2 -n ai@%h
      -B -s /tmp/celerybeat-schedule --loglevel=info
    environment:
      <<: *backend-env
      LLM_TIMEOUT_S: "180"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # Opens untrusted decks. No network, no secrets, only the shared job folder.
  converter:
    build:
      context: ./converter
      args:
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
    image: course-assistant/converter
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
      - /home/converter:uid=1000
    volumes:
      - convert:/convert
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: course-assistant/web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres:
  redis:
  minio:
  embedder_models:
  convert:
  work:
