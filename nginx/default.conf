proxy_cache_path /var/cache/nginx/auth levels=1:2 keys_zone=auth:1m max_size=10m inactive=2m;

map $request_uri $media_scope {
    ~^/media/(?<area>videos|decks)/(?<asset>\d+)/(?<part>[a-z]+)/  $area/$asset/$part;
    default                                                        $request_uri;
}

server {
    listen 80;

    # Resolve per request: a recreated container gets a new IP, and nginx must follow it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;
    set $minio http://minio:9000;

    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types application/json application/javascript text/css application/vnd.apple.mpegurl;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /api/v1/internal/ {
        return 404;
    }

    location = /_media_auth {
        internal;
        proxy_pass $api/api/v1/internal/media-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_cache auth;
        proxy_cache_key "$cookie_session|$media_scope";
        proxy_cache_valid 200 204 60s;
        proxy_cache_valid 401 403 5s;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
    }

    # Students stream through here, only after auth_request has said yes.
    location /media/ {
        auth_request /_media_auth;
        rewrite ^/media/(.*)$ /course-media/$1 break;
        proxy_pass $minio;
        proxy_set_header Host minio:9000;
        proxy_set_header Cookie "";
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
    }

    # Admin browsers upload parts here. The signature covers Host and path, which are restored.
    location /s3/ {
        rewrite ^/s3/(.*)$ /$1 break;
        proxy_pass $minio;
        proxy_set_header Host minio:9000;
        proxy_set_header Cookie "";
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 0;
        proxy_read_timeout 600s;
        limit_except PUT { deny all; }
    }

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
